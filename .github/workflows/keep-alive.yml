name: Keep Render Projects Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier instances from spinning down
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Deployments
        run: |
          echo "Pinging Aegis Platform..."
          curl -sI -o /dev/null -w "%{http_code}\n" https://aegis-elvv.onrender.com || true

          echo "Pinging SignalScale Lead Scoring..."
          curl -sI -o /dev/null -w "%{http_code}\n" https://lead-scoring-q7dj.onrender.com || true

          echo "Pinging Handwritten Digit Recognizer..."
          curl -sI -o /dev/null -w "%{http_code}\n" https://handwritten-digit-recognition-1mv5.onrender.com || true
